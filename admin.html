<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yönetim paneli | Yarımburgaz Spor</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
  /* Düzen: üstte sabit kırmızı çubuk (Kaydet her zaman görünür), altında açılır kapanır bölümler */
  :root { --kirmizi: #d1261b; --kirmizi-koyu: #a51b12; --koyu: #242021; --zemin: #edeeef; --kart: #fff; --yazi: #242021; --yazi-2: #6a6566; --cizgi: #dcd9d9; --serit: #f5f4f4; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--zemin); color: var(--yazi); font: 400 1rem/1.5 "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--kirmizi); color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.1rem; }
  header a { color: #fff; font-size: .92rem; }
  .ust-dugmeler { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; display: grid; gap: 14px; }
  .kart { background: var(--kart); border-radius: 4px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  h2 { margin: 0 0 12px; font-size: 1.1rem; }
  label { display: block; font-size: .88rem; font-weight: 600; margin-bottom: 4px; }
  input[type="text"], input[type="number"], input[type="date"], input[type="email"], input[type="password"], textarea { font: inherit; padding: 9px 11px; border: 1px solid var(--cizgi); border-radius: 3px; width: 100%; background: #fff; color: var(--yazi); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 3px; padding: 9px 16px; cursor: pointer; background: var(--kirmizi); color: #fff; }
  button:hover { background: var(--kirmizi-koyu); }
  button.ikincil { background: #f1efef; color: var(--yazi); border: 1px solid var(--cizgi); }
  button.ikincil:hover { background: #e6e3e3; }
  button.kucuk { padding: 5px 10px; font-size: .85rem; }
  header button { background: #fff; color: var(--kirmizi-koyu); }
  header button:hover { background: #ffe9a6; }
  header button.ikincil { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
  button[disabled] { opacity: .55; cursor: default; }
  :focus-visible { outline: 3px solid #f6d21c; outline-offset: 2px; }
  .durum { margin: 0; font-size: .9rem; min-height: 1.4em; }
  .durum.hata, small.hata { color: #9a5b00; font-weight: 600; }
  header .durum { color: #fff; }
  header .durum.hata { color: #ffe9a6; }
  details.bolum { background: var(--kart); border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06); border-left: 5px solid var(--kirmizi); }
  details.bolum > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; }
  details.bolum[open] > summary { border-bottom: 1px solid var(--cizgi); }
  details.bolum > .nesne, details.bolum > fieldset { margin: 16px 18px 18px; }
  .nesne { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 16px; align-items: start; }
  .nesne > fieldset, .nesne > .alan:has(textarea), .nesne > .alan:has(.yukle) { grid-column: 1 / -1; }
  fieldset { border: 1px solid var(--cizgi); border-radius: 4px; padding: 12px 14px 14px; margin: 0; min-width: 0; }
  legend { font-weight: 700; font-size: .9rem; padding: 0 6px; }
  .onay { display: flex; gap: 8px; align-items: center; font-weight: 500; margin: 0; padding-top: 6px; }
  .oge { background: var(--serit); border: 1px solid var(--cizgi); border-radius: 4px; padding: 12px; margin-bottom: 10px; display: grid; gap: 10px; }
  .oge-ust { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .oge-ust strong { overflow-wrap: anywhere; }
  .dugmeler { display: flex; gap: 6px; flex-wrap: wrap; }
  .yukle { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .yukle img.onizle { width: 64px; height: 64px; object-fit: cover; border-radius: 3px; border: 1px solid var(--cizgi); background: #fff; }
  .yukle small { color: var(--yazi-2); }
  p.bos { margin: 0 0 10px; color: var(--yazi-2); font-size: .9rem; }
  .giris label { margin-top: 12px; }
  .giris input { max-width: 360px; }
  .giris button { margin-top: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Yarımburgaz Spor · Yönetim paneli</h1>
  <div class="ust-dugmeler" id="panel" hidden>
    <p class="durum" id="kayit-durum" role="status" aria-live="polite"></p>
    <button type="button" id="kaydet" disabled>Kaydet</button>
    <a href="sohbet-yonetim.html">Sohbet yönetimi</a>
    <a href="./" target="_blank" rel="noopener">Siteyi aç</a>
    <button type="button" class="ikincil" id="cikis">Çıkış yap</button>
  </div>
</header>
<main>
  <section class="kart giris" id="giris-kart">
    <h2>Yönetici girişi</h2>
    <form id="giris-form">
      <label for="g-eposta">E-posta</label>
      <input id="g-eposta" type="email" autocomplete="username" required>
      <label for="g-sifre">Şifre</label>
      <input id="g-sifre" type="password" autocomplete="current-password" required>
      <div><button type="submit" id="g-dugme">Giriş yap</button></div>
    </form>
    <p class="durum" id="giris-durum" role="status" aria-live="polite"></p>
  </section>
  <div id="form"></div>
</main>
<script src="js/data.js?v=1794752161"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/admin.js?v=1794752161"></script>
</body>
</html>
